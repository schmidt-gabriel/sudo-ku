version: 2

project_name: sudo-ku

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/sudo-ku
    binary: sudo-ku
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: sudo-ku
    repository:
      owner: schmidt-gabriel
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/schmidt-gabriel/sudo-ku
    description: Terminal sudoku with notes, undo and an interactive tutorial
    license: MIT
    # Homebrew 7 deprecates postflight blocks, which GoReleaser's hooks
    # generate, in favor of declarative postflight_steps. The step removes
    # macOS quarantine from the unsigned binary; it is a no-op on Linux.
    # custom_block is a GoReleaser template, hence the escaped {{staged_path}}.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/sudo-ku"], must_succeed: false
      end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
